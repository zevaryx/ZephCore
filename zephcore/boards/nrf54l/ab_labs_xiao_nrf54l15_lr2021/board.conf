# AB Labs XIAO nRF54L15 + Wio-LR2021 carrier
# SPDX-License-Identifier: MIT

CONFIG_ZEPHCORE_BOARD_NAME="AB Labs LLC Xiao-nrf54 LR2021"

CONFIG_BT_DIS_MODEL_NUMBER_STR="AB Labs XIAO nRF54L15 LR2021"

CONFIG_ZEPHCORE_RADIO_LR2021=y

# FLPR core reserves 68KB of RAM; 450 contacts is the ceiling that fits
CONFIG_ZEPHCORE_MAX_CONTACTS=450

# The same carrier raises PA_OVP/OCP on every TX at 18 and 20-22 dBm with the
# nRF52840; 17 dBm is clean. Cap until the supply/PA design is understood.
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=17
CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=17
