# AB Labs XIAO nRF52840 + Wio-LR2021 carrier
# SPDX-License-Identifier: MIT

CONFIG_ZEPHCORE_BOARD_NAME="AB Labs LLC Xiao-nrf52 LR2021"

CONFIG_BT_DIS_MODEL_NUMBER_STR="AB Labs XIAO nRF52840 LR2021"

CONFIG_ZEPHCORE_SD_FWID=0x0123

CONFIG_ZEPHCORE_RADIO_LR2021=y

# The LR2021 raises PA_OVP/OCP on every TX at 18 and 20-22 dBm on this board;
# 17 dBm is clean. Cap until the supply/PA design is understood.
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=17
CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=17
