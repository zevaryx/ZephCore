# AB Labs XIAO ESP32-S3 + Wio-LR2021 carrier
# SPDX-License-Identifier: MIT

CONFIG_ZEPHCORE_BOARD_NAME="AB Labs LLC Xiao-ESP32S3 LR2021"

CONFIG_BT_DIS_MODEL_NUMBER_STR="AB Labs XIAO ESP32-S3 LR2021"

CONFIG_ZEPHCORE_RADIO_LR2021=y

# PSRAM mode — ESP32-S3R8 is silicon-strapped OPI octal.
# Enable is auto-detected from DTS by Kconfig.psram; only the mode is set here.
CONFIG_SPIRAM_MODE_OCT=y

# The same carrier raises PA_OVP/OCP on every TX at 18 and 20-22 dBm with the
# nRF52840; 17 dBm is clean. Cap until the supply/PA design is understood.
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=17
CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=17
